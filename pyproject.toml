[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kunji"
dynamic = ["version"]
description = "Bring your own key. Every AI model in one clean, professional terminal."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kunji contributors" }]
keywords = ["ai", "llm", "cli", "byok", "openai", "anthropic", "gemini", "ollama", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=13.7",
  "typer>=0.12",
  "httpx>=0.27",
  "keyring>=25",
  "platformdirs>=4",
  "prompt_toolkit>=3.0.43",
  "questionary>=2.0",
  "tomli-w>=1.0",
  "cryptography>=42",
  "pyperclip",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/testwithsuraj/kunji"
Issues = "https://github.com/testwithsuraj/kunji/issues"
Changelog = "https://github.com/testwithsuraj/kunji/blob/main/CHANGELOG.md"

[project.scripts]
kunji = "kunji.cli:main"

[tool.hatch.version]
path = "src/kunji/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kunji"]

[tool.hatch.build.targets.sdist]
include = ["src/kunji", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
