name: Feature request
description: Suggest an idea or a new provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would it look in the terminal? Commands, output, anything helps.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
