# Release: push a tag like v0.1.0 (it must match __version__ in src/kunji/__init__.py).
#   git tag v0.1.0 && git push origin v0.1.0
#
# One-time setup:
#   1. pypi.org → Your projects → Publishing → add a "trusted publisher":
#        owner: testwithsuraj   repo: kunji   workflow: release.yml   environment: pypi
#   2. GitHub repo → Settings → Environments → create "pypi" (add yourself as reviewer
#      so every release needs one click of approval).
# No PyPI token is stored anywhere — trusted publishing uses short-lived OIDC tokens.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches package version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/kunji/__init__.py').read()).group(1))")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }

  dist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine && python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Windows + Linux binaries are required for a release.
  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: kunji-windows-x64.exe
          - os: ubuntu-latest
            name: kunji-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller packaging/kunji.spec --noconfirm --clean
      - name: Rename binary
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then cp dist/kunji.exe "out/${{ matrix.name }}"; else cp dist/kunji "out/${{ matrix.name }}"; fi
          "./out/${{ matrix.name }}" --version
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}

  # macOS binary is optional: GitHub's Mac machines are sometimes unavailable
  # ("job was not acquired by Runner"). That must never block PyPI or the release.
  binaries-macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      matrix:
        include:
          - name: kunji-macos-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller packaging/kunji.spec --noconfirm --clean
      - name: Rename binary
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then cp dist/kunji.exe "out/${{ matrix.name }}"; else cp dist/kunji "out/${{ matrix.name }}"; fi
          "./out/${{ matrix.name }}" --version
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}

  publish-pypi:
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish-pypi, binaries-macos]
    # Runs even if the optional macOS build failed or never started.
    if: ${{ always() && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Checksums
        run: |
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
