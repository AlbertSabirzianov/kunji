name: CI

# Skipped when a change only touches the website, docs, Markdown or the installer scripts:
# the Pages workflow builds and checks the docs when it deploys, and installer.yml tests the
# installers. That keeps docs-only PRs free of CI runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs-site/**"
      - "site/**"
      - "site-src/**"
      - "docs/**"
      - "assets/**"
      - "**.md"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/pages.yml"
      - ".github/workflows/installer.yml"
  pull_request:
    paths-ignore:
      - "docs-site/**"
      - "site/**"
      - "site-src/**"
      - "docs/**"
      - "assets/**"
      - "**.md"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/pages.yml"
      - ".github/workflows/installer.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Smoke test the CLI
        run: |
          kunji --version
          kunji providers
          kunji config path

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
